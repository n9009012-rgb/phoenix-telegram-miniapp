<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Phoenix Telegram Mini App 1.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080a10;--panel:#11151e;--line:#252b38;--text:#f4f6fb;--muted:#9aa4b5;--accent:#8b5cf6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-top:env(safe-area-inset-top)}
#app{height:100%;display:flex;flex-direction:column}
.top{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(8,10,16,.96);border-bottom:1px solid var(--line);z-index:10}
.brand{font-weight:800;letter-spacing:.3px}.brand span{color:var(--accent)}
.period{font-size:12px;color:var(--muted)}
#frameWrap{position:relative;flex:1;min-height:0;background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.bottom{height:66px;flex:0 0 66px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(10,12,18,.98);border-top:1px solid var(--line);z-index:20}
.navbtn{border:0;background:transparent;color:#8f98a8;border-radius:12px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.navbtn b{font-size:20px;line-height:20px;font-weight:500}.navbtn.active{color:#fff;background:#171b26}.navbtn.active b{color:var(--accent)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080a10;color:#cbd2df;z-index:5;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span>●</span> PHOENIX</div>
    <div class="period">Sales Control Center · Mini App 1.0</div>
  </header>
  <main id="frameWrap">
    <div id="loading">Загрузка Phoenix…</div>
    <iframe id="phoenix" title="Phoenix Sales Control Center"
      src="Sales_Control_Center_Phoenix_2.8.0_FULL_2026-08-12-06-31.html"></iframe>
  </main>
  <nav class="bottom">
    <button class="navbtn active" data-module="dashboard"><b>⌂</b><span>Главная</span></button>
    <button class="navbtn" data-module="sales"><b>▥</b><span>Продажи</span></button>
    <button class="navbtn" data-module="employees"><b>♙</b><span>ТП</span></button>
    <button class="navbtn" data-module="outlets"><b>▣</b><span>ТТ</span></button>
    <button class="navbtn" data-module="more"><b>☰</b><span>Ещё</span></button>
  </nav>
</div>
<script>
(function(){
  const tg=window.Telegram?.WebApp;
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#080a10');tg.setBackgroundColor('#080a10');}catch(e){}}
  const frame=document.getElementById('phoenix'), loading=document.getElementById('loading');
  let doc=null;

  function injectMobile(){
    try{
      doc=frame.contentDocument;
      if(!doc)return;
      const style=doc.createElement('style');
      style.textContent=`
        html,body{max-width:100%!important;overflow-x:hidden!important}
        .sidebar{display:none!important}
        .app{display:block!important;min-height:100vh!important}
        .main,.content,.workspace,.page,.dashboard-main{width:100%!important;max-width:none!important;margin:0!important;padding-left:10px!important;padding-right:10px!important}
        table{font-size:12px!important}
        .module-panel{max-width:100%!important}
        input,select,button{max-width:100%}
      `;
      doc.head.appendChild(style);
      const active=doc.querySelector('.nav a[data-module="dashboard"]');
      if(active)active.click();
      loading.style.display='none';
    }catch(e){
      loading.textContent='Phoenix загружен. Если экран пустой — проверьте, что оба HTML-файла лежат рядом.';
    }
  }
  frame.addEventListener('load',injectMobile);

  function clickModule(key){
    if(!doc)return;
    if(key==='more'){
      const first=doc.querySelector('.nav a[data-module="manager"]');
      if(first)first.click();
      return;
    }
    const el=doc.querySelector('.nav a[data-module="'+key+'"]');
    if(el)el.click();
  }
  document.querySelectorAll('.navbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      clickModule(btn.dataset.module);
    });
  });
})();
</script>
</body>
</html>
